<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nível 1 - Matemática Avante</title>


    <!-- ================================
    CSS
    ================================= -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- ================================
    LUCIDE ICONS
    ================================= -->

    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>


    <!-- ================================
    CABEÇALHO
    ================================= -->

    <header>


        <!-- BOTÃO VOLTAR -->

        <button
            id="voltarPagina"
            type="button"
            class="icon-button"
            aria-label="Voltar para a página anterior"
        >

            <i data-lucide="arrow-left"></i>

        </button>


        <!-- TÍTULO -->

        <h1>
            🌱 Nível 1
        </h1>


        <!-- MODO ESCURO -->

        <button
            id="modoEscuro"
            type="button"
            class="icon-button"
            aria-label="Ativar modo escuro"
        >

            <i data-lucide="moon"></i>

        </button>


        <!-- MENU -->

        <button
            id="botaoMenu"
            type="button"
            class="icon-button"
            aria-label="Abrir menu"
        >

            <i data-lucide="menu"></i>

        </button>


    </header>


    <!-- ================================
    CONTEÚDO PRINCIPAL
    ================================= -->

    <main class="pagina-nivel">


        <!-- ================================
        INTRODUÇÃO DO NÍVEL
        ================================= -->

        <section class="nivel-introducao">


            <div class="nivel-topo-icone">

                <i data-lucide="sprout"></i>

            </div>


            <h2>
                Fundamentos
            </h2>


            <p>
                Comece pelos conceitos básicos e pratique
                os primeiros conhecimentos da Matemática.
            </p>


        </section>


        <!-- ================================
        ÁREA DE QUESTÕES
        ================================= -->

        <section class="area-questoes">


            <!-- ================================
            CABEÇALHO DA QUESTÃO
            ================================= -->

            <div class="cabecalho-questoes">


                <div>

                    <span class="questao-label">
                        QUESTÃO
                    </span>


                    <h2 id="numeroQuestao">
                        1
                    </h2>

                </div>


                <div class="contador-questoes">

                    <span id="questaoAtual">
                        1
                    </span>

                    /

                    <span id="totalQuestoes">
                        10
                    </span>

                </div>


            </div>


            <!-- ================================
            BARRA DE PROGRESSO
            ================================= -->

            <div class="barra-questoes">

                <div
                    id="progressoQuestoes"
                    class="progresso-questoes"
                ></div>

            </div>


            <!-- ================================
            QUESTÃO
            ================================= -->

            <div class="questao-nivel">


                <h3 id="enunciadoQuestao">
                    Quanto é 2 + 3?
                </h3>


                <div
                    id="alternativasQuestao"
                    class="alternativas-nivel"
                >


                    <!--
                    As alternativas são preenchidas
                    pelo JavaScript.
                    -->


                </div>


                <p
                    id="resultadoQuestao"
                    class="resultado-questao"
                ></p>


            </div>              <!-- ================================
            PONTUAÇÃO
            ================================= -->

            <div class="pontuacao-nivel">


                <span>
                    Pontuação
                </span>


                <strong id="pontuacaoNivel">
                    0
                </strong>


            </div>


            <!-- ================================
            NAVEGAÇÃO ENTRE QUESTÕES
            ================================= -->

            <div class="botoes-navegacao-questao">


                <!-- QUESTÃO ANTERIOR -->

                <button
                    id="questaoAnterior"
                    class="botao-anterior-questao"
                    type="button"
                >

                    <i data-lucide="arrow-left"></i>

                    <span>
                        Questão anterior
                    </span>

                </button>


                <!-- PRÓXIMA QUESTÃO -->

                <button
                    id="proximaQuestao"
                    class="botao-proxima-questao"
                    type="button"
                >

                    <span>
                        Próxima questão
                    </span>

                    <i data-lucide="arrow-right"></i>

                </button>


            </div>


        </section>


    </main>      <!-- ================================
    FUNDO DO MENU
    ================================= -->

    <div
        id="fundoMenu"
        aria-hidden="true"
    ></div>


    <!-- ================================
    MENU LATERAL
    ================================= -->

    <aside
        id="menuLateral"
        aria-label="Menu principal"
    >


        <h2>
            Menu
        </h2>


        <!-- PERFIL -->

        <a
            href="perfil.html"
            class="menu-item"
        >

            <i data-lucide="user-round"></i>

            <span>
                Perfil
            </span>

        </a>


        <!-- MATÉRIAS -->

        <a
            href="materias.html"
            class="menu-item"
        >

            <i data-lucide="book-open"></i>

            <span>
                Matérias
            </span>

        </a>


        <!-- ATIVIDADES -->

        <a
            href="atividades.html"
            class="menu-item"
        >

            <i data-lucide="clipboard-list"></i>

            <span>
                Atividades
            </span>

        </a>


        <!-- PROFESSORES -->

        <div class="menu-item">

            <i data-lucide="graduation-cap"></i>

            <span>
                Professores
            </span>

        </div>


        <!-- MEU PROGRESSO -->

        <div class="menu-item">

            <i data-lucide="chart-column"></i>

            <span>
                Meu progresso
            </span>

        </div>


        <!-- PREMIUM -->

        <div class="menu-item">

            <i data-lucide="gem"></i>

            <span>
                Premium
            </span>

        </div>


        <!-- PLANOS -->

        <div class="menu-item">

            <i data-lucide="credit-card"></i>

            <span>
                Planos e Assinaturas
            </span>

        </div>


        <!-- CONFIGURAÇÕES -->

        <div class="menu-item">

            <i data-lucide="settings"></i>

            <span>
                Configurações
            </span>

        </div>


        <!-- SOBRE -->

        <a
            href="sobre.html"
            class="menu-item"
        >

            <i data-lucide="info"></i>

            <span>
                Sobre
            </span>

        </a>


    </aside>


    <!-- ================================
    JAVASCRIPT DO SITE
    ================================= -->

    <script src="js/script.js"></script>


    <!-- ================================
    JAVASCRIPT DO NÍVEL 1
    ================================= -->

    <script src="js/nivel1.js"></script>


    <!-- ================================
    INICIALIZAR ÍCONES
    ================================= -->

    <script>

        if (window.lucide) {

            lucide.createIcons();

        }

    </script>


</body>

</html>
